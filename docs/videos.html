<!DOCTYPE html>
<html lang="en" data-static-lang="en" data-lang-base="./" data-nav-base="./" data-page-path="videos.html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRIX video tutorials — STRIX</title>
  <meta name="description" content="STRIX video tutorials — step-by-step tutorials and menu how-tos on the STRIX YouTube channel." />
  <!-- SEO:HEAD:START (generated by scripts/site/ — do not edit by hand) -->
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://dcr-st.com/videos.html" />
<!-- SEO:HEAD:END -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <style>
    /* Video window — opened as its own browser window by the home hero button
       (site.js [data-video-window]); help_video_renewal_devplan.md §10.9 */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font-ui); font-size: 15px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .vid-head {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface-1);
    }
    .vid-logo { font-weight: 800; letter-spacing: .08em; color: #fff; }
    .vid-head h1 { margin: 0; font-size: 17px; font-weight: 700; color: var(--text); flex: 1; min-width: 0; }
    .vid-tabs { display: flex; gap: 6px; padding: 12px 20px 0; background: var(--surface-1); }
    .vid-tab {
      font: inherit; font-size: 14px; padding: 9px 16px; cursor: pointer;
      border: 1px solid var(--border); border-bottom: 0; border-radius: 8px 8px 0 0;
      background: var(--surface-2); color: var(--text-dim);
    }
    .vid-tab:hover { color: var(--text); }
    .vid-tab.on { background: var(--bg); color: var(--accent); border-color: var(--border-accent); }
    .vid-main {
      flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px;
      border-top: 1px solid var(--border);
    }
    .vid-player { min-width: 0; min-height: 0; padding: 18px 20px; display: flex; flex-direction: column; overflow: auto; }
    /* As large as the window allows while keeping 16:9 (190px = header + tabs + bar + padding) */
    .vid-frame {
      position: relative; width: min(100%, calc((100vh - 190px) * 16 / 9)); aspect-ratio: 16 / 9;
      margin: 0 auto; background: #000; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    .vid-frame:fullscreen { width: 100%; height: 100%; border: 0; border-radius: 0; }
    /* Fallback "fill the window" when real full screen is refused (videos.js fillWindow) */
    body.vid-max .vid-frame {
      position: fixed; inset: 0; z-index: 100; width: 100%; height: 100%; margin: 0;
      aspect-ratio: auto; border: 0; border-radius: 0;
    }
    .vid-max-exit { display: none; }
    body.vid-max .vid-max-exit {
      display: block; position: fixed; top: 12px; right: 12px; z-index: 101;
      font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; cursor: pointer;
      background: var(--surface-glass); border: 1px solid var(--border-strong); color: var(--text);
    }
    .vid-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .vid-poster {
      position: absolute; inset: 0; width: 100%; border: 0; cursor: pointer; font: inherit; color: var(--text);
      background: radial-gradient(ellipse at 50% 45%, var(--surface-3), #05050a 75%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;
    }
    .vid-poster-title { font-size: clamp(16px, 2.2vw, 24px); font-weight: 700; text-align: center; max-width: 80%; }
    .vid-play {
      width: 84px; height: 58px; border-radius: 14px; background: #e02020; position: relative; transition: transform .15s;
    }
    .vid-play::after {
      content: ""; position: absolute; left: 34px; top: 17px;
      border-left: 22px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent;
    }
    .vid-poster:hover .vid-play, .vid-poster:focus-visible .vid-play { transform: scale(1.08); }
    .vid-consent { position: absolute; left: 12px; right: 12px; bottom: 12px; font-size: 12px; color: var(--text-dim); text-align: center; }
    .vid-empty {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 24px; text-align: center;
      background: radial-gradient(ellipse at 50% 45%, var(--surface-2), #05050a 75%);
    }
    .vid-empty strong { font-size: 20px; color: #fff; }
    .vid-empty-body { color: var(--text-dim); max-width: 460px; line-height: 1.6; }
    .vid-empty-ico { width: 72px; height: 50px; border-radius: 13px; background: #e02020; opacity: .85; }
    .vid-bar {
      width: min(100%, calc((100vh - 190px) * 16 / 9)); margin: 12px auto 0;
      display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap;
    }
    .vid-meta { flex: 1; min-width: 220px; }
    .vid-meta h2 { margin: 0; font-size: 16px; font-weight: 700; color: #fff; }
    .vid-meta p { margin: 4px 0 0; color: var(--text-dim); font-size: 13px; line-height: 1.6; }
    .vid-meta p:empty { display: none; }
    .vid-btn, .vid-yt {
      font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 14px; border-radius: 8px; cursor: pointer; text-decoration: none;
      background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text);
    }
    .vid-btn:hover:not(:disabled), .vid-yt:hover { border-color: var(--border-accent); color: var(--accent); }
    .vid-btn:disabled { display: none; }   /* nothing to play yet (empty state) */
    .vid-ico-fs { width: 14px; height: 14px; border: 2px solid currentColor; border-radius: 2px; position: relative; box-sizing: border-box; }
    .vid-ico-yt { width: 18px; height: 13px; border-radius: 3px; background: #e02020; display: inline-block; }
    .vid-list { min-height: 0; overflow: auto; border-left: 1px solid var(--border); background: var(--surface-1); }
    .vid-item {
      width: 100%; display: flex; gap: 12px; align-items: flex-start; text-align: left; font: inherit; color: var(--text);
      padding: 12px 16px; border: 0; border-bottom: 1px solid var(--border); background: transparent; cursor: pointer;
    }
    .vid-item:hover { background: var(--surface-2); }
    .vid-item.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
    .vid-item-no {
      flex: none; width: 30px; height: 30px; border-radius: 6px; background: var(--surface-3);
      display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);
    }
    .vid-item.on .vid-item-no { color: var(--accent); }
    .vid-item-tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .vid-item-title { font-size: 14px; line-height: 1.4; }
    .vid-item-dur { font-size: 12px; color: var(--text-mute); font-family: var(--font-mono); }
    .vid-list-note { margin: 0; padding: 18px 16px; color: var(--text-dim); font-size: 13px; line-height: 1.6; }

    /* Phones / narrow windows: one column, list under the player */
    @media (max-width: 820px) {
      body { overflow: auto; height: auto; }
      .vid-main { grid-template-columns: 1fr; }
      .vid-player { padding: 12px 16px; overflow: visible; }
      .vid-frame, .vid-bar { width: 100%; }
      .vid-list { border-left: 0; border-top: 1px solid var(--border); }
      .vid-head, .vid-tabs { padding-left: 16px; padding-right: 16px; }
      .vid-head h1 { font-size: 15px; }
      #vidChannel, .vid-empty-ico { display: none; }   /* the bar below carries the YouTube link */
      .vid-btn, .vid-yt { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>
  <header class="vid-head">
    <span class="vid-logo">STRIX</span>
    <h1 data-i18n="vid.pageTitle">STRIX video tutorials</h1>
    <a class="vid-yt" id="vidChannel" href="https://www.youtube.com/@strix-st" target="_blank" rel="noopener"><i class="vid-ico-yt" aria-hidden="true"></i><span data-i18n="vid.channel">See all on our YouTube channel</span></a>
  </header>
  <nav class="vid-tabs" id="vidTabs" role="tablist"></nav>
  <main class="vid-main">
    <section class="vid-player">
      <div class="vid-frame" id="vidFrame"></div>
      <div class="vid-bar">
        <div class="vid-meta"><h2 id="vidTitle"></h2><p id="vidDesc"></p></div>
        <button type="button" class="vid-btn" id="vidFullscreen"><i class="vid-ico-fs" aria-hidden="true"></i><span data-i18n="vid.fullscreen">Full screen</span></button>
        <a class="vid-yt" id="vidOnYoutube" href="https://www.youtube.com/@strix-st" target="_blank" rel="noopener"><i class="vid-ico-yt" aria-hidden="true"></i><span data-i18n="vid.openYt">Watch on YouTube</span></a>
      </div>
    </section>
    <aside class="vid-list" id="vidList"></aside>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/videos.config.js"></script>
  <script src="js/videos.js"></script>
</body>
</html>
