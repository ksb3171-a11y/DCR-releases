  <style>
    /* Video window — opened as its own browser window by the home hero button
       (site.js [data-video-window]); help_video_renewal_devplan.md §10.9 */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font-ui); font-size: 15px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .vid-head {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface-1);
    }
    .vid-logo { font-weight: 800; letter-spacing: .08em; color: #fff; }
    .vid-head h1 { margin: 0; font-size: 17px; font-weight: 700; color: var(--text); flex: 1; min-width: 0; }
    .vid-tabs { display: flex; gap: 6px; padding: 12px 20px 0; background: var(--surface-1); }
    .vid-tab {
      font: inherit; font-size: 14px; padding: 9px 16px; cursor: pointer;
      border: 1px solid var(--border); border-bottom: 0; border-radius: 8px 8px 0 0;
      background: var(--surface-2); color: var(--text-dim);
    }
    .vid-tab:hover { color: var(--text); }
    .vid-tab.on { background: var(--bg); color: var(--accent); border-color: var(--border-accent); }
    .vid-main {
      flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px;
      border-top: 1px solid var(--border);
    }
    .vid-player { min-width: 0; min-height: 0; padding: 18px 20px; display: flex; flex-direction: column; overflow: auto; }
    /* As large as the window allows while keeping 16:9 (190px = header + tabs + bar + padding) */
    .vid-frame {
      position: relative; width: min(100%, calc((100vh - 190px) * 16 / 9)); aspect-ratio: 16 / 9;
      margin: 0 auto; background: #000; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    .vid-frame:fullscreen { width: 100%; height: 100%; border: 0; border-radius: 0; }
    /* Fallback "fill the window" when real full screen is refused (videos.js fillWindow) */
    body.vid-max .vid-frame {
      position: fixed; inset: 0; z-index: 100; width: 100%; height: 100%; margin: 0;
      aspect-ratio: auto; border: 0; border-radius: 0;
    }
    .vid-max-exit { display: none; }
    body.vid-max .vid-max-exit {
      display: block; position: fixed; top: 12px; right: 12px; z-index: 101;
      font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; cursor: pointer;
      background: var(--surface-glass); border: 1px solid var(--border-strong); color: var(--text);
    }
    .vid-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .vid-poster {
      position: absolute; inset: 0; width: 100%; border: 0; cursor: pointer; font: inherit; color: var(--text);
      background: radial-gradient(ellipse at 50% 45%, var(--surface-3), #05050a 75%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;
    }
    .vid-poster-title { font-size: clamp(16px, 2.2vw, 24px); font-weight: 700; text-align: center; max-width: 80%; }
    .vid-play {
      width: 84px; height: 58px; border-radius: 14px; background: #e02020; position: relative; transition: transform .15s;
    }
    .vid-play::after {
      content: ""; position: absolute; left: 34px; top: 17px;
      border-left: 22px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent;
    }
    .vid-poster:hover .vid-play, .vid-poster:focus-visible .vid-play { transform: scale(1.08); }
    .vid-consent { position: absolute; left: 12px; right: 12px; bottom: 12px; font-size: 12px; color: var(--text-dim); text-align: center; }
    .vid-empty {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 24px; text-align: center;
      background: radial-gradient(ellipse at 50% 45%, var(--surface-2), #05050a 75%);
    }
    .vid-empty strong { font-size: 20px; color: #fff; }
    .vid-empty-body { color: var(--text-dim); max-width: 460px; line-height: 1.6; }
    .vid-empty-ico { width: 72px; height: 50px; border-radius: 13px; background: #e02020; opacity: .85; }
    .vid-bar {
      width: min(100%, calc((100vh - 190px) * 16 / 9)); margin: 12px auto 0;
      display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap;
    }
    .vid-meta { flex: 1; min-width: 220px; }
    .vid-meta h2 { margin: 0; font-size: 16px; font-weight: 700; color: #fff; }
    .vid-meta p { margin: 4px 0 0; color: var(--text-dim); font-size: 13px; line-height: 1.6; }
    .vid-meta p:empty { display: none; }
    .vid-btn, .vid-yt {
      font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 14px; border-radius: 8px; cursor: pointer; text-decoration: none;
      background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text);
    }
    .vid-btn:hover:not(:disabled), .vid-yt:hover { border-color: var(--border-accent); color: var(--accent); }
    .vid-btn:disabled { display: none; }   /* nothing to play yet (empty state) */
    .vid-ico-fs { width: 14px; height: 14px; border: 2px solid currentColor; border-radius: 2px; position: relative; box-sizing: border-box; }
    .vid-ico-yt { width: 18px; height: 13px; border-radius: 3px; background: #e02020; display: inline-block; }
    .vid-side { min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--border); background: var(--surface-1); }
    .vid-side-tabs { flex: none; display: flex; border-bottom: 1px solid var(--border); }
    .vid-side-tabs[hidden], .vid-list[hidden], .vc-pane[hidden], .vid-btn[hidden] { display: none; }
    .vid-side-tab { flex: 1; padding: 11px 8px; font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--text-dim); cursor: pointer; box-shadow: inset 0 -2px 0 transparent; }
    .vid-side-tab:hover { color: var(--text); }
    .vid-side-tab.on { color: var(--accent); font-weight: 700; box-shadow: inset 0 -2px 0 var(--accent); }
    .vid-btn.on { border-color: var(--border-accent); color: var(--accent); background: var(--accent-soft); }
    .vid-list { flex: 1; min-height: 0; overflow: auto; }
    /* Comments (videoComments.js) */
    .vc-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .vc-tool { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-dim); }
    .vc-sp { flex: 1; }
    .vc-sort { font: inherit; font-size: 13px; padding: 3px 6px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text); color-scheme: dark; }
    .vc-sort option { background: var(--surface-2); color: var(--text); }
    .vc-flag { font: inherit; font-size: 12px; padding: 2px 9px; border-radius: 999px; cursor: pointer; background: var(--warn-soft); border: 1px solid var(--warn); color: var(--warn); }
    .vc-flag.on { background: var(--warn); color: var(--accent-ink); font-weight: 700; }
    .vc-list { flex: 1; min-height: 0; overflow: auto; }
    .vc { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .vc-reply { padding-left: 44px; }
    .vc-off { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
    .vc-hid { opacity: .62; }
    .vc-h { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 13px; }
    .vc-av { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-3); color: var(--text-soft); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
    .vc-av-st { background: var(--accent); color: var(--accent-ink); }
    .vc-name { font-weight: 700; color: var(--text); }
    .vc-date { font-size: 12px; color: var(--text-mute); }
    .vc-pill { font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 6px; border-radius: 4px; white-space: nowrap; }
    .vc-p-off { background: var(--accent); color: var(--accent-ink); }
    .vc-p-pin, .vc-p-me { background: var(--surface-3); color: var(--text-soft); }
    .vc-p-pin { color: var(--accent); }
    .vc-p-rep { background: var(--warn-soft); color: var(--warn); }
    .vc-p-hid { background: var(--danger-soft); color: var(--danger); }
    .vid-item .vc-p-rep { flex: none; margin-left: auto; }
    .vc-b { margin: 6px 0 0; font-size: 14px; line-height: 1.55; color: var(--text-soft); overflow-wrap: anywhere; white-space: pre-wrap; }
    .vc-gone { color: var(--text-mute); font-style: italic; }
    .vc-ts { font-family: var(--font-mono); font-size: 13px; padding: 0 4px; border: 0; border-radius: 4px; cursor: pointer; background: var(--accent-soft); color: var(--accent); }
    .vc-ts:hover { background: var(--accent); color: var(--accent-ink); }
    .vc-a { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
    .vc-lnk { font: inherit; font-size: 12px; padding: 0; border: 0; background: transparent; color: var(--text-dim); cursor: pointer; }
    .vc-lnk:hover:not(:disabled) { color: var(--accent); }
    .vc-lnk.vc-dng:hover { color: var(--danger); }
    .vc-lnk:disabled { cursor: not-allowed; }
    .vc-empty { height: 100%; min-height: 190px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; }
    .vc-empty strong { font-size: 15px; color: #fff; }
    .vc-empty span { font-size: 13px; line-height: 1.6; color: var(--text-dim); }
    .vc-cp { flex: none; padding: 10px 14px 12px; border-top: 1px solid var(--border-strong); background: var(--surface-2); }
    .vc-cp textarea { display: block; width: 100%; height: 62px; resize: none; padding: 8px 10px; font: inherit; font-size: 14px; line-height: 1.5; border-radius: 8px; background: var(--surface-3); border: 1px solid var(--border-strong); color: var(--text); }
    .vc-cp textarea:focus { outline: 0; border-color: var(--accent); }
    .vc-note { margin: 0 0 9px; font-size: 13px; line-height: 1.55; color: var(--text-soft); }
    .vc-ctx { display: flex; align-items: center; margin-bottom: 6px; font-size: 12px; color: var(--accent); }
    .vc-adm { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 7px; font-size: 13px; color: var(--text-soft); }
    .vc-adm label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
    .vc-adm input, .vc-radio input { margin: 0; accent-color: var(--accent); }
    .vc-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
    .vc-cnt { font-family: var(--font-mono); font-size: 12px; color: var(--text-mute); }
    .vc-btn { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; background: var(--surface-3); border: 1px solid var(--border-strong); color: var(--text); }
    .vc-btn:hover:not(:disabled) { border-color: var(--border-accent); color: var(--accent); }
    .vc-btn:disabled { cursor: not-allowed; background: var(--surface-2); border-color: var(--border); color: var(--text-dim); }
    .vc-pri, .vc-pri:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
    .vc-dngb, .vc-dngb:hover:not(:disabled) { background: var(--danger); border-color: var(--danger); color: var(--accent-ink); font-weight: 700; }
    .vc-back { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5,5,10,.62); }
    .vc-dlg { width: 380px; max-width: 100%; padding: 18px 18px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border-strong); box-shadow: var(--shadow-2); }
    .vc-dlg h3 { margin: 0 0 6px; font-size: 16px; color: #fff; }
    .vc-dlg p { margin: 0 0 12px; font-size: 13px; line-height: 1.55; color: var(--text-dim); }
    .vc-dlg .vc-err { margin: 0; color: var(--danger); }
    .vc-dlg blockquote { margin: 0 0 12px; padding: 7px 10px; font-size: 13px; line-height: 1.5; border-left: 3px solid var(--border-strong); background: var(--surface-1); color: var(--text-soft); overflow-wrap: anywhere; }
    .vc-radio { display: flex; gap: 7px; align-items: center; padding: 4px 0; font-size: 14px; cursor: pointer; }
    .vc-field { display: block; margin-bottom: 9px; font-size: 13px; color: var(--text-dim); }
    .vc-field input { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; font: inherit; font-size: 14px; border-radius: 8px; background: var(--surface-3); border: 1px solid var(--border-strong); color: var(--text); }
    .vc-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .vc-toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 210; max-width: calc(100% - 32px); padding: 8px 14px; font-size: 13px; border-radius: 8px; background: var(--surface-glass); border: 1px solid var(--border-accent); color: var(--text); }
    .vid-item {
      width: 100%; display: flex; gap: 12px; align-items: flex-start; text-align: left; font: inherit; color: var(--text);
      padding: 12px 16px; border: 0; border-bottom: 1px solid var(--border); background: transparent; cursor: pointer;
    }
    .vid-item:hover { background: var(--surface-2); }
    .vid-item.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
    .vid-item-no {
      flex: none; width: 30px; height: 30px; border-radius: 6px; background: var(--surface-3);
      display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);
    }
    .vid-item.on .vid-item-no { color: var(--accent); }
    .vid-item-tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .vid-item-title { font-size: 14px; line-height: 1.4; }
    .vid-item-dur { font-size: 12px; color: var(--text-mute); font-family: var(--font-mono); }
    .vid-list-note { margin: 0; padding: 18px 16px; color: var(--text-dim); font-size: 13px; line-height: 1.6; }

    /* Phones / narrow windows: one column, list under the player */
    @media (max-width: 820px) {
      body { overflow: auto; height: auto; }
      .vid-main { grid-template-columns: 1fr; }
      .vid-player { padding: 12px 16px; overflow: visible; }
      .vid-frame, .vid-bar { width: 100%; }
      .vid-side { border-left: 0; border-top: 1px solid var(--border); }
      .vc-pane { height: 640px; flex: none; }
      .vid-head, .vid-tabs { padding-left: 16px; padding-right: 16px; }
      .vid-head h1 { font-size: 15px; }
      #vidChannel, .vid-empty-ico { display: none; }   /* the bar below carries the YouTube link */
      .vid-btn, .vid-yt { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>
  <header class="vid-head">
    <span class="vid-logo">STRIX</span>
    <h1 data-i18n="vid.pageTitle">STRIX video tutorials</h1>
    <a class="vid-yt" id="vidChannel" href="https://www.youtube.com/@strix-st" target="_blank" rel="noopener"><i class="vid-ico-yt" aria-hidden="true"></i><span data-i18n="vid.channel">See all on our YouTube channel</span></a>
  </header>
  <nav class="vid-tabs" id="vidTabs" role="tablist"></nav>
  <main class="vid-main">
    <section class="vid-player">
      <div class="vid-frame" id="vidFrame"></div>
      <div class="vid-bar">
        <div class="vid-meta"><h2 id="vidTitle"></h2><p id="vidDesc"></p></div>
        <button type="button" class="vid-btn" id="vidCommentsBtn" hidden></button>
        <button type="button" class="vid-btn" id="vidFullscreen"><i class="vid-ico-fs" aria-hidden="true"></i><span data-i18n="vid.fullscreen">Full screen</span></button>
        <a class="vid-yt" id="vidOnYoutube" href="https://www.youtube.com/@strix-st" target="_blank" rel="noopener"><i class="vid-ico-yt" aria-hidden="true"></i><span data-i18n="vid.openYt">Watch on YouTube</span></a>
      </div>
    </section>
    <aside class="vid-side">
      <div class="vid-side-tabs" id="vidSideTabs" role="tablist" hidden>
        <button type="button" class="vid-side-tab on" id="vidSideList" role="tab" aria-selected="true"></button>
        <button type="button" class="vid-side-tab" id="vidSideComments" role="tab" aria-selected="false"></button>
      </div>
      <div class="vid-list" id="vidList"></div>
      <div class="vc-pane" id="vidComments" hidden></div>
    </aside>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/videos.config.js"></script>
  <script src="js/videos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/videoComments.js"></script>
</body>
</html>
